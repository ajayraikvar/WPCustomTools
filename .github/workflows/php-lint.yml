name: PHP, JavaScript, Package and Release Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Check PHP syntax and persistence tests
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/php-additional-keywords-smoke.php
          php tests/php-elementor-widget-smoke.php

  javascript-lint:
    name: JavaScript syntax and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax and behavior
        run: |
          node --check assets/js/category-search.js
          node --check assets/js/additional-keywords.js
          node tests/js-tools-smoke.cjs
          node tests/elementor-widget-smoke.cjs

  package:
    name: Build, verify and publish installable ZIP
    needs: [php-lint, javascript-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^[[:space:]]*[*] Version:' wp-custom-tools.php | awk '{print $3}')"
          STABLE_TAG="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')"
          test -n "$VERSION"
          if [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "Plugin version ($VERSION) does not match readme Stable tag ($STABLE_TAG)." >&2
            exit 1
          fi
          mkdir -p package/wp-custom-tools dist
          cp wp-custom-tools.php readme.txt LICENSE package/wp-custom-tools/
          cp -R includes assets package/wp-custom-tools/
          (cd package && zip -qr "../dist/WPCustomTools-v${VERSION}.zip" wp-custom-tools)
          unzip -t "dist/WPCustomTools-v${VERSION}.zip"
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/wp-custom-tools.php$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/includes/class-wpct-admin-menu.php$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/includes/class-wpct-additional-keywords.php$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/assets/js/category-search.js$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/assets/js/additional-keywords.js$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/assets/css/additional-keywords.css

      - name: Upload installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPCustomTools-installable
          path: dist/WPCustomTools-v*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^[[:space:]]*[*] Version:' wp-custom-tools.php | awk '{print $3}')"
          STABLE_TAG="$(grep -m1 '^Stable tag:' readme.txt | awk '{print $3}')"
          if [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "Refusing to publish: plugin version and Stable tag do not match." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          ZIP="dist/WPCustomTools-v${VERSION}.zip"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          cat > dist/release-notes.md <<'NOTES'
          ## What's included

          - WooCommerce category search scoped to the full **All categories** checklist, not **Most Used**.
          - Additional Keywords editor box for supported posts, pages and products, with a phrase counter and copy helper.
          - WP Custom Tools admin menu and manual GitHub version check.
          - Elementor's editable WP Custom Product Card widget with image or self-hosted video, title, rating, pricing, offers and CTA controls.
          - Input sanitization, capability checks, nonce validation and no keyword-management network calls.

          ## Installation

          In WordPress, go to **Plugins → Add New Plugin → Upload Plugin**, upload the attached ZIP, and replace the previous WP Custom Tools version when prompted.

          ## Important

          Additional Keywords are stored in WP Custom Tools metadata and do not automatically populate AIOSEO's private metadata or alter AIOSEO's content score.
          NOTES

          gh release create "$TAG" "$ZIP"             --repo "$GH_REPO"             --target "$GITHUB_SHA"             --title "WP Custom Tools v${VERSION}"             --notes-file dist/release-notes.md

          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/includes/class-wpct-elementor-widget.php

      - name: Upload installable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPCustomTools-installable
          path: dist/WPCustomTools-v*.zip
          if-no-files-found: error
