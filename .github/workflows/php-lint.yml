name: PHP, JavaScript and Package Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Check PHP syntax and persistence tests
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/php-additional-keywords-smoke.php

  javascript-lint:
    name: JavaScript syntax and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax and behavior
        run: |
          node --check assets/js/category-search.js
          node --check assets/js/additional-keywords.js
          node tests/js-tools-smoke.cjs

  package:
    name: Build and verify installable ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^[[:space:]]*[*] Version:' wp-custom-tools.php | awk '{print $3}')"
          test -n "$VERSION"
          mkdir -p package/wp-custom-tools dist
          cp wp-custom-tools.php readme.txt LICENSE package/wp-custom-tools/
          cp -R includes assets package/wp-custom-tools/
          (cd package && zip -qr "../dist/WPCustomTools-v${VERSION}.zip" wp-custom-tools)
          unzip -t "dist/WPCustomTools-v${VERSION}.zip"
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/wp-custom-tools.php$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/includes/class-wpct-admin-menu.php$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/includes/class-wpct-additional-keywords.php$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/assets/js/category-search.js$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/assets/js/additional-keywords.js$'
          unzip -Z1 "dist/WPCustomTools-v${VERSION}.zip" | grep -q '^wp-custom-tools/assets/css/additional-keywords.css$'

      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WPCustomTools-installable
          path: dist/WPCustomTools-v*.zip
          if-no-files-found: error
          retention-days: 30
